<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Home Bar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B8%3C/text%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bg:#faf7f2;--fg:#1f1b16;--mut:#6b6157;--card:#fff;--line:#e6ddd0;--acc:#b4532a;--ok:#2f7d4f;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--fg:#f2ebe1;--mut:#b0a494;--card:#221d17;--line:#3a322a;--acc:#e08a5c;--ok:#5fc08a;--no:#f08a82}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#17130f;--fg:#f2ebe1;--mut:#b0a494;--card:#221d17;--line:#3a322a;--acc:#e08a5c;--ok:#5fc08a;--no:#f08a82}
:root[data-theme="light"]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding-bottom:76px}
main{max-width:640px;margin:0 auto;padding:12px 14px}
h1{font-size:22px;margin:6px 0 2px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 6px}
h3.cat{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;padding:4px 0}
h3.cat span{font-size:12px}
.sum,.mut{color:var(--mut);font-size:14px}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.chip,.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:20px;padding:8px 14px;font:inherit;font-size:14px}
.chip.on,.btn{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border-radius:10px;padding:10px 16px}
.btn.sec{background:var(--card);color:var(--fg);border-color:var(--line)}
.chip.warn{border-color:var(--no);color:var(--no);background:transparent}
a.chip{display:inline-block;text-decoration:none;color:var(--fg)}
.fb{white-space:normal}
.item,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{display:block}
.ct{cursor:pointer}
.ctr{display:flex;justify-content:space-between;gap:10px;align-items:center}
.need{color:var(--mut);font-size:14px;margin-top:2px}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:middle}
.tg{width:48px;height:28px;border-radius:14px;border:0;background:var(--line);position:relative;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--ok)}.tg.on i{left:23px}
.del{border:0;background:none;color:var(--no);font-size:18px;padding:4px 8px}
.ing{padding:3px 0;font-size:15px}.y{color:var(--ok)}.n{color:var(--no)}
.out{white-space:pre-wrap;font-size:15px;margin-top:10px}
.badge{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--line);color:var(--fg)}
.badge.ok{background:var(--ok);color:#fff}.badge.new{background:var(--acc);color:#fff}
.rev{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.rev input[type=checkbox]{width:22px;height:22px;margin-top:8px;accent-color:var(--acc)}
.thumb{max-width:100%;max-height:160px;border-radius:10px;display:block;margin:8px 0}
.empty{padding:14px;text-align:center;color:var(--mut);font-size:14px}
input,select,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);min-width:0;box-sizing:border-box}
input[type=search]{width:100%}
textarea{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:none;color:var(--mut);padding:14px 0;font:inherit;font-size:12px;white-space:nowrap}
.lbl{display:flex;flex-direction:column;min-width:0}
.why{color:var(--mut);font-size:13px}
.tab.on{color:var(--acc);font-weight:600}
a{color:var(--acc)}
.nm{background:none;border:0;color:var(--fg);font:inherit;text-align:left;padding:0;flex:1;min-width:0;cursor:pointer}
.nm .chev{color:var(--mut);margin-left:4px}
.tag.low{color:var(--no);border-color:var(--no)}
.tag.af{color:var(--ok);border-color:var(--ok)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:11;max-width:640px;margin:0 auto;box-shadow:0 -4px 24px rgba(0,0,0,.25)}
.veil.top{z-index:12}.sheet.top{z-index:13}
.sheet h2{font-size:19px;margin:0;line-height:1.25}
.sheet h3{margin-top:16px}
.lk{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;align-items:center}
</style></head><body>
<main id="main"></main>
<div id="sheet"></div>
<nav><button class="tab" data-t="stock">🍾 Bar</button><button class="tab" data-t="cocktails">🍸 Cocktails</button><button class="tab" data-t="ideas">✨ Ideas</button><button class="tab" data-t="gear">🧰 Essentials</button><button class="tab" data-t="settings">⚙️ Settings</button></nav>
<script>
const VERSION='v23';
// ---------- Default data ----------
// Starting list for a new install: [in stock, not in stock] per category. Deliberately generic and
// all "not in stock" so you tick what you own (or restore a backup). Names match the recipe keys in R.
// Alcohol-free versions sit in the category of the drink they replace (see AFRX below).
const DEF={
"Gin":[[],["London dry gin","Alcohol-free gin"]],
"Whisky":[[],["Scotch whisky","Bourbon","Rye whiskey"]],
"Rum":[[],["White rum","Dark rum","Spiced rum","Overproof rum","Coconut rum"]],
"Vodka":[[],["Vodka"]],
"Tequila":[[],["Tequila","Mezcal"]],
"Brandy":[[],["Brandy","Pisco"]],
"Liqueurs":[[],["Triple sec","Amaretto","Coffee liqueur","Irish cream liqueur","Pimm's No. 1","Maraschino liqueur","Crème de violette","Crème de cacao","Drambuie","Falernum"]],
"Amari & herbal":[[],["Green Chartreuse","Yellow Chartreuse","Bénédictine","Absinthe","Averna","Amaro Nonino"]],
"Aperitifs & fortified wines":[[],["Aperol","Campari","Sweet vermouth","Dry vermouth","Lillet Blanc","Prosecco"]],
"Bitters":[[],["Aromatic bitters","Orange bitters","Peychaud's bitters"]],
"Mixers":[[],["Club soda","Tonic water","Ginger beer","Grapefruit soda","Cola","Lemonade","Lime juice","Lemon juice","Orange juice","Cranberry juice","Grapefruit juice","Pineapple juice","Tomato juice","Cream of coconut","Peach purée","Double cream"]],
"Syrups & sugar":[[],["Simple syrup","Grenadine","Sugar","Honey","Orgeat","Raspberry syrup","Cinnamon syrup"]],
"Garnish & fresh":[[],["Limes","Lemons","Oranges","Cucumber","Fresh mint","Fresh ginger","Olives","Cherries","Eggs","Ice"]],
"Store cupboard":[[],["Espresso","Worcestershire sauce","Hot sauce","Orange flower water"]]};
// Built-in cocktails: "Name;ingredient;ingredient", each ingredient a list of alternatives split by "|". An ingredient is met
// when an in-stock item's name contains one alternative as whole words. The first alternative is the name shown when it is missing.
// Optional bits, garnish twists, salt and pepper are left out; a garnish stays only when the drink depends on it.
// Fresh fruit counts for its juice and sugar for simple syrup, since either can be made on the spot.
const LIME='lime juice|limes',LEMON='lemon juice|lemons',SYR='simple syrup|sugar syrup|sugar',SODA='club soda|soda water|sparkling water',
  EGG='egg white|eggs|aquafaba',CREAM='double cream|single cream|whipping cream|heavy cream',TRIPLE='triple sec|cointreau|orange curaçao|orange curacao|grand marnier',
  BITT='aromatic bitters|angostura bitters',FIZZ='prosecco|champagne|sparkling wine|cava|crémant',ABS='absinthe|pastis|pernod|herbsaint',BRANDY='brandy|cognac',
  SCOTCH='scotch whisky|scotch|whisky',MARA='maraschino liqueur|maraschino originale|luxardo maraschino',PINE='pineapple juice|fresh pineapple',COCO='cream of coconut|coconut cream',
  GREENC='green chartreuse|chartreuse verte',PEY="peychaud's bitters|peychaud";
const R=[
// Pre-Prohibition and spirit-forward
`Old Fashioned;bourbon|rye whiskey|whisky;${SYR};${BITT}`,`Manhattan;rye whiskey|bourbon|whisky;sweet vermouth;${BITT}`,`Dry Martini;gin;dry vermouth;olives|lemons`,
`Negroni;gin;campari;sweet vermouth`,`Boulevardier;bourbon|rye whiskey|whisky;campari;sweet vermouth`,`Sazerac;rye whiskey|cognac|brandy;${PEY};${SYR};${ABS}`,
`Martinez;gin;sweet vermouth;${MARA};orange bitters|${BITT}`,`Vieux Carré;rye whiskey|bourbon;${BRANDY};sweet vermouth;bénédictine|benedictine;${PEY}|${BITT}`,
`Rusty Nail;${SCOTCH};drambuie`,`Godfather;${SCOTCH};amaretto|disaronno`,
// Sours and daisies
`Daiquiri;white rum|spiced rum|dark rum;${LIME};${SYR}`,`Margarita;tequila;${TRIPLE};${LIME}`,`Whiskey Sour;bourbon|rye whiskey|whisky;${LEMON};${SYR}`,
`Sidecar;${BRANDY};${TRIPLE};${LEMON}`,`Gimlet;gin;${LIME};${SYR}`,`Aviation;gin;${MARA};crème de violette|creme de violette|violette;${LEMON}`,
`Clover Club;gin;${LEMON};raspberry syrup|raspberries;${EGG}`,`Pisco Sour;pisco;${LIME};${SYR};${EGG};${BITT}`,
`Amaretto Sour;amaretto|disaronno;${LEMON};${SYR}`,`Amaretto Sour (Morgenthaler);amaretto|disaronno;bourbon;${LEMON};${SYR};${EGG}`,
`White Lady;gin;${TRIPLE};${LEMON};${EGG}`,
// Highballs, fizzes and long drinks
`Tom Collins;gin;${LEMON};${SYR};${SODA}`,`Gin & Tonic;gin;tonic water;limes|lime juice`,`Moscow Mule;vodka;ginger beer;${LIME}`,
`Dark 'n' Stormy;dark rum|spiced rum;ginger beer;${LIME}`,`Paloma;tequila;${LIME};grapefruit soda|grapefruit juice`,
`Mojito;white rum|spiced rum;${LIME};fresh mint|mint;${SYR};${SODA}`,`Gin Fizz;gin;${LEMON};${SYR};${SODA}`,
`Ramos Gin Fizz;gin;${LEMON};${LIME};${SYR};${CREAM};${EGG};orange flower water|orange blossom water;${SODA}`,
`Americano;campari;sweet vermouth;${SODA}`,`Whiskey Highball;scotch whisky|whisky;${SODA}`,
// Equal parts, bitter and herbal
`Last Word;gin;${GREENC};${MARA};${LIME}`,`Paper Plane;bourbon;aperol;amaro nonino|nonino;${LEMON}`,
`Corpse Reviver #2;gin;${TRIPLE};lillet blanc|lillet|cocchi americano;${LEMON};${ABS}`,`Bijou;gin;${GREENC};sweet vermouth;orange bitters`,
`Naked and Famous;mezcal;aperol;yellow chartreuse|chartreuse jaune;${LIME}`,`Black Manhattan;rye whiskey|bourbon;averna|amaro;${BITT}|orange bitters`,
// Sparkling
`French 75;gin|cognac|brandy;${LEMON};${SYR};${FIZZ}`,`Champagne Cocktail;${FIZZ};sugar|simple syrup;${BITT}`,`Aperol Spritz;aperol;${FIZZ};${SODA}`,
`Bellini;${FIZZ};peach purée|peach puree|peach nectar|peaches`,
// Tiki and tropical
`Mai Tai;aged rum|dark rum|gold rum;${LIME};orange curaçao|orange curacao|triple sec|cointreau;orgeat|almond syrup;${SYR}`,
`Zombie;dark rum|aged rum|gold rum;overproof rum|navy rum;${LIME};grapefruit juice;falernum;cinnamon syrup;grenadine;${ABS}`,
`Jungle Bird;dark rum|blackstrap rum|aged rum;campari;${PINE};${LIME};demerara syrup|${SYR}`,`Piña Colada;white rum;${COCO};${PINE}`,
`Painkiller;dark rum|navy rum|pusser's;${PINE};orange juice|oranges;${COCO}`,
// Modern classics and staples
`Espresso Martini;vodka;espresso|instant coffee|ground coffee|coffee beans;coffee liqueur|kahlua|kahlúa|tia maria;${SYR}`,
`Penicillin;${SCOTCH};${LEMON};honey;fresh ginger|ginger syrup|root ginger|ginger root`,`Cosmopolitan;vodka;${TRIPLE};cranberry juice;${LIME}`,
`Bloody Mary;vodka;tomato juice;${LEMON};worcestershire sauce|worcestershire;hot sauce|tabasco|sriracha`,`Brandy Alexander;${BRANDY};crème de cacao|creme de cacao;${CREAM}`,
// Easy extras
`Cuba Libre;white rum|spiced rum|dark rum;cola;${LIME}`,`Screwdriver;vodka;orange juice|oranges`,`White Russian;vodka;coffee liqueur|kahlua|kahlúa|tia maria;${CREAM}|milk`,
`Black Russian;vodka;coffee liqueur|kahlua|kahlúa|tia maria`,`Tequila Sunrise;tequila;orange juice|oranges;grenadine`,`Pimm's Cup;pimms|pimm's;lemonade;cucumber|oranges|fresh mint|strawberries`
].map(r=>{const p=r.split(';');return{name:p[0],ing:p.slice(1).map(x=>x.split('|'))}});
// Bar essentials: [name, what it is for]. Everything starts as "missing" so you tick what you own.
const GEAR={
"Equipment":[
["Cocktail shaker","Shaken drinks: Daiquiri, Margarita, Whiskey Sour, Cosmopolitan"],
["Jigger or measure","Consistent amounts; most recipes build on 25 ml steps"],
["Hawthorne strainer","Strains shaken drinks cleanly out of the shaker"],
["Fine mesh strainer","Double-strain citrus and mint drinks for a clean finish"],
["Bar spoon","Stirring Martini, Manhattan, Negroni; layering"],
["Mixing glass","Stirred drinks that should never be shaken"],
["Muddler","Mojito mint and lime, Old Fashioned sugar"],
["Citrus press or juicer","Fresh lime and lemon juice beats bottled every time"],
["Y-peeler or channel knife","Citrus twists for Martini, Old Fashioned, Negroni"],
["Paring knife and small board","Wedges and wheels for garnish"],
["Large ice cube tray","Big cubes melt slowly in an Old Fashioned or Negroni"],
["Ice bucket and tongs","Keeps ice clean and handy while you make a round"],
["Cocktail picks","Olives and cherries for Martini and Manhattan"],
["Bottle opener and corkscrew","Tonic, ginger beer, prosecco, vermouth"]],
"Glassware":[
["Rocks glass","Old Fashioned, Negroni, Whiskey Sour, Rusty Nail"],
["Highball or Collins glass","Gin & Tonic, Mojito, Tom Collins, Paloma, Moscow Mule"],
["Coupe or Martini glass","Martini, Manhattan, Daiquiri, Cosmopolitan, Sidecar"],
["Champagne flute","French 75, Champagne Cocktail, Bellini"],
["Large wine glass","Aperol Spritz and other spritzes"],
["Copper mug","Moscow Mule; optional but traditional"],
["Shot glass","Measuring in a pinch, and shots"]]};
// ---------- Storage ----------
function load(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?Object.assign(d,v):d}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function seedGear(){const g=[];for(const c in GEAR)GEAR[c].forEach(([n,w])=>g.push({n,c,w,s:0}));return g}
// Alcohol-free products carry af:1 and live in the category of the drink they replace (an alcohol-free gin sits in Gin).
// They count in cocktail matching like the real thing; lists show a 0% tag and prompts call them alcohol-free.
const AFRX=/alcohol[- ]?free|non[- ]?alc|zero[- ]proof|(^|\s)0\.0(?![\d.])|(^|\s)0(\.0)?\s?%/i;   // names that are clearly alcohol-free
const NACAT=/non[- ]?alc|alcohol[- ]?free|zero[- ]proof/i;                                      // the old separate category
const afOf=(n,c)=>AFRX.test(n)||NACAT.test(c||'')?1:undefined;
// Where an alcohol-free product belongs: [name pattern, pattern for an existing category of that kind, default category].
const HOME=[[/\bgin\b/i,/^gin/i,'Gin'],[/whisk(e)?y|bourbon|\brye\b|scotch/i,/^whisk/i,'Whisky'],[/\brum\b|\brhum\b/i,/^rum/i,'Rum'],[/vodka/i,/^vodka/i,'Vodka'],
  [/tequila|mezcal|agave/i,/^tequila|agave/i,'Tequila'],[/brandy|cognac/i,/^brandy|cognac/i,'Brandy'],
  [/aperitiv|aperitif|aperol|campari|vermouth|spritz|prosecco|sparkling|\bwine\b/i,/aperitif|vermouth|wine/i,'Aperitifs & fortified wines'],
  [/liqueur|amaretto|triple sec|irish cream/i,/liqueur/i,'Liqueurs'],[/bitters/i,/^bitters/i,'Bitters']];
function homeFor(n){const r=HOME.find(([x])=>x.test(n));if(!r)return null;return S.items.map(i=>i.c).find(c=>!NACAT.test(c)&&r[1].test(c))||r[2]}
// v21 move: anything in a "Non-alcoholic spirits" style category is flagged and moved to its drink's category.
// Items whose kind cannot be told from the name stay where they are, flagged, for the user to move.
function migrateAF(){let n=0;S.items.forEach(i=>{if(!NACAT.test(i.c))return;if(!i.af){i.af=1;n++}const c=homeFor(i.n);if(c){i.c=c;n++}});return n}
// Kit added to GEAR after release: put each on an existing Essentials list once (not ticked), so a deleted one stays deleted.
const NEWGEAR=['Champagne flute'];
function migrateGear(){S.gk=S.gk||[];let n=0;NEWGEAR.forEach(nm=>{if(S.gk.includes(nm))return;S.gk.push(nm);n++;
  if(S.gear.some(g=>g.n===nm))return;for(const c in GEAR){const e=GEAR[c].find(x=>x[0]===nm);if(e)S.gear.push({n:nm,c,w:e[1],s:0})}});return n}
function seed(){const items=[];for(const c in DEF){DEF[c][0].forEach(n=>items.push({n,c,s:1,af:afOf(n)}));DEF[c][1].forEach(n=>items.push({n,c,s:0,af:afOf(n)}))}return{items,gear:seedGear(),saved:[]}}
let S=null;try{S=JSON.parse(localStorage.getItem('homebar2'))}catch(e){}
if(!S||!Array.isArray(S.items))S=seed();
if(!Array.isArray(S.gear))S.gear=seedGear();
if(!Array.isArray(S.saved))S.saved=[];   // recipes kept from "Surprise me" and "How to make": {id,name,text,src,extra?,t}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P=load('homebar_prefs',{col:{},theme:'auto',lastBk:0,chg:0,bkLater:0});   // collapsed categories, appearance, backup tracking
function save(){S.t=Date.now();store('homebar2',S);P.chg=(P.chg||0)+1;store('homebar_prefs',P)}   // chg counts saves since the last backup
if(migrateAF()+migrateGear())save();
const AI=load('homebar_ai',{rec:{},ideas:null,notes:{},gear:{}});    // cached Gemini answers (recipes, ideas, per-bottle notes, per-essential tips)
if(!AI.notes||typeof AI.notes!=='object')AI.notes={};
if(!AI.gear||typeof AI.gear!=='object')AI.gear={};
function setStock(i,v){i.s=v?1:0;if(!i.s)delete i.l;save()}  // out of stock can't also be "running low"
function removeItem(i){S.items=S.items.filter(x=>x!==i);if(!S.items.some(x=>x.n===i.n)&&AI.notes[i.n]){delete AI.notes[i.n];store('homebar_ai',AI)}save()}  // drop its tasting notes too
// Inline rename used by Edit mode on the Bar and Essentials tabs. Tasting notes follow the new name.
let ren=null,renMsg='';
function renameRow(i,list,after){
  const inp=h('input',{value:i.n,'aria-label':'New name',style:'flex:1'});
  const done=()=>{const v=inp.value.trim();if(!v||v===i.n){ren=null;renMsg='';after();return}
    if(list.some(x=>x!==i&&x.n===v)){renMsg='Another item is already called "'+v+'".';after();return}
    const nb=list===S.items?AI.notes:AI.gear;if(nb[i.n]){nb[v]=nb[i.n];delete nb[i.n];store('homebar_ai',AI)}
    i.n=v;save();ren=null;renMsg='';after()};
  const cancel=()=>{ren=null;renMsg='';after()};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')done();else if(e.key==='Escape')cancel()});
  const w=h('div',{c:'item',style:'flex-wrap:wrap'},inp,h('button',{c:'del',style:'color:var(--ok)','aria-label':'Save name',onclick:done},'✓'),h('button',{c:'del',style:'color:var(--mut)','aria-label':'Cancel rename',onclick:cancel},'✕'));
  if(renMsg)w.append(h('div',{c:'sum',style:'flex:1 1 100%'},renMsg));
  setTimeout(()=>{inp.focus();inp.select()},0);
  return w;
}
function resetAll(){S=seed();AI.rec={};AI.ideas=null;AI.notes={};AI.gear={};store('homebar_ai',AI);mood='Anything';style='Any';extra='';open=null;openS=null;det=null;gdet=null;save()}
function applyTheme(){const r=document.documentElement;if(P.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.theme)}
function restoreDefaults(){let n=0;for(const c in DEF)[0,1].forEach(k=>DEF[c][k].forEach(nm=>{if(!S.items.some(i=>i.n===nm)){S.items.push({n:nm,c,s:0,af:afOf(nm)});n++}}));
  for(const c in GEAR)GEAR[c].forEach(([nm,w])=>{if(!S.gear.some(g=>g.n===nm)){S.gear.push({n:nm,c,w,s:0});n++}});save();return n}
// ---------- Gemini ----------
const GK='homebar_gemini_key',GM='homebar_gemini_model',GDEF='gemini-3.8-flash';
const gkey=()=>localStorage.getItem(GK)||'';
const gmodel=()=>localStorage.getItem(GM)||GDEF;
function gset(k,m){if(k)localStorage.setItem(GK,k);else localStorage.removeItem(GK);if(m&&m!==GDEF)localStorage.setItem(GM,m);else localStorage.removeItem(GM)}
const GTIMEOUT=60000;   // the whole call, including streaming, gives up after this
// Free-tier text models from Google's pricing page (2026-10-08), best first. Free quotas are counted per model, so when the
// preferred model is busy or out of quota the next one usually answers. Pro, image, audio and video models have no free tier.
const GMODELS=['gemini-3.8-flash','gemini-3.7-flash','gemini-3.6-flash','gemini-3.5-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3-flash-preview','gemini-2.5-flash-lite'];
const gorder=()=>[gmodel(),...GMODELS.filter(m=>m!==gmodel())];

async function bulkNotes(){

  const rows=allRecipes().map(r=>({r,m:r.ing.filter(a=>!have(a))}));
  [['Make now',x=>x.m.length===0],['One ingredient away',x=>x.m.length===1],['Further away',x=>x.m.length>1]].forEach(([t,f])=>{
    const g=rows.filter(f).sort((p,q)=>p.m.length-q.m.length);if(!g.length)return;
    w.append(h('h3',{},t+' ('+g.length+')'));g.forEach(x=>w.append(card(x.r,x.m)));
  });
  return w;
}
// ---------- Ideas tab ----------
function ideas(){
  const w=h('div');w.append(h('h1',{},'Ideas'),h('div',{c:'sum'},'Two suggestions at a time, based on what is in stock.'));
  // Two parameters: mood (how you feel) and style (how the drink is built)
  const STYLES={Any:'',Long:'a tall drink lengthened with a mixer or soda, served over ice in a highball',Short:'a spirit-forward drink with little or no mixer, served in a rocks or coupe glass',Bittersweet:'built on bitter aperitifs or amari balanced with sweetness, Negroni territory',Dry:'crisp and not sweet, Martini territory',Fizzy:'topped with soda, tonic, prosecco or ginger beer',Creamy:'rich and dessert-like, using cream or cream liqueurs',Fruity:'juice- or fruit-led and easy drinking'};
  const bar=h('div',{c:'row2'}),bar2=h('div',{c:'row2'});
  ['Anything','Refreshing','Strong','Sweet','Sour','Light'].forEach(m=>bar.append(h('button',{c:'chip'+(mood===m?' on':''),onclick:()=>{mood=m;render()}},m)));
  Object.keys(STYLES).forEach(s=>bar2.append(h('button',{c:'chip'+(style===s?' on':''),onclick:()=>{style=s;render()}},s)));
  const out=h('div',{c:'out'});out.textContent=AI.ideas?AI.ideas.text:'';
  const note=h('span',{c:'sum'}),say=t=>{note.textContent=t};
  // Free-text ingredient to build around (anything, not just bar stock)
  const xi=h('input',{placeholder:'Use up something odd, e.g. a jar of lychees, fresh basil',style:'width:100%','aria-label':'Extra ingredient',oninput:e=>{extra=e.target.value}});xi.value=extra;
  const go=h('button',{c:'btn',onclick:()=>{
    const s=stocked();if(!s.length){out.textContent='Mark some items as in stock first.';return}
    const x=extra.trim(),st=style!=='Any'?' Style: '+style+', meaning '+STYLES[style]+'. Both drinks must fit that style.':'';
    const p='I have a home bar with these in stock: '+s.join(', ')+'. Assume ice and water.'+kitLine(false)
      +(x?' I also have this on hand and want to use it: "'+x+'". Both suggestions must feature it. If it is not a usual cocktail ingredient, improvise sensibly: say how to prepare it (muddle, infuse, syrup, garnish, rinse) and which of my bottles it suits best, and pick drinks that genuinely work rather than forcing it in.':'')
      +' Suggest exactly 2 cocktails I can make right now, one classic and one creative riff. Mood: '+mood+'.'+st
      +' Lay out each one exactly like this: the drink name on its own line, then "Ingredients:" with one ingredient per line and all liquids measured in ml (never oz), then "Method:" as 2 to 4 short numbered steps ending with the glass and garnish. Leave a blank line between the two drinks.'
      +(x?'':' Finish with one line naming the single bottle'+(S.gear.some(g=>g.s)?', or one piece of kit I do not have,':'')+' that would unlock the most new drinks.')+' Plain text, no markdown, no asterisks.';
    ask(p,out,t=>{AI.ideas={text:t,mood,style,extra:x,t:Date.now()};store('homebar_ai',AI);render()},go)}},'Surprise me');
  xi.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});
  const row=h('div',{c:'row2'},go);
  if(extra.trim())row.append(h('button',{c:'chip',onclick:()=>{extra='';render()}},'Clear ingredient'));
  w.append(h('h3',{},'Mood'),bar,h('h3',{},'Style'),bar2,h('h3',{},'Something to use up'),xi,row);
  if(AI.ideas){row.append(...outChips(()=>AI.ideas.text,'Cocktail ideas',say),note);
    w.append(h('div',{c:'sum'},'Last ideas · '+AI.ideas.mood+(AI.ideas.style&&AI.ideas.style!=='Any'?' · '+AI.ideas.style:'')+(AI.ideas.extra?' · using: '+AI.ideas.extra:'')+' · '+new Date(AI.ideas.t).toLocaleDateString()))}
  w.append(out);
  if(AI.ideas){
    const parts=splitIdeas(AI.ideas.text),sv=h('div',{c:'row2'});
    (parts.length?parts:[{name:'Ideas · '+AI.ideas.mood,text:AI.ideas.text}]).forEach(p=>{const done=isSaved(p.text);
      sv.append(h('button',{c:'chip'+(done?' on':''),disabled:done?'':null,onclick:()=>{keep(p.name,p.text,'ideas',AI.ideas.extra);render()}},(done?'Saved: ':'Save: ')+p.name))});
    w.append(h('div',{c:'sum',style:'margin-top:10px'},'Keep one for later? Saved recipes live under Cocktails.'),sv);
    // One tap to put the odd ingredient into the bar list so it counts next time
    const x=(AI.ideas.extra||'').trim(),cs=cats();
    if(x&&!S.items.some(i=>norm(i.n)===norm(x))){
      const sel=h('select',{'aria-label':'Category for '+x},...cs.map(c=>h('option',{value:c},c)));sel.value=cs.includes('Garnish & fresh')?'Garnish & fresh':cs[0];
      w.append(h('div',{c:'row2'},h('button',{c:'chip',onclick:()=>{S.items.push({n:cap(x),c:sel.value,s:1,u:1,af:afOf(x,sel.value)});save();render()}},'Add "'+cap(x)+'" to my bar'),sel));
    }
  }
  return w;
}
// ---------- Essentials tab ----------
let gf='all',gdet=null;
function removeGear(g){S.gear=S.gear.filter(x=>x!==g);if(!S.gear.some(x=>x.n===g.n)&&AI.gear[g.n]){delete AI.gear[g.n];store('homebar_ai',AI)}save()}
function gear(){
  const w=h('div');const own=S.gear.filter(g=>g.s).length;
  w.append(h('h1',{},'Bar essentials'),h('div',{c:'sum'},own+' of '+S.gear.length+' in your kit'+(own?' · tap a name for tips':' · tick what you already own')));
  const bar=h('div',{c:'row2'});
  [['all','All'],['in','Have'],['out','Missing']].forEach(([f,l])=>bar.append(h('button',{c:'chip'+(gf===f?' on':''),onclick:()=>{gf=f;render()}},l)));
  bar.append(h('button',{c:'chip'+(edit?' on':''),onclick:()=>{edit=!edit;ren=null;renMsg='';render()}},edit?'Done':'Edit'));
  w.append(bar);
  if(edit)w.append(h('div',{c:'sum'},'Tap a name to rename it, ✕ to delete.'));
  const gcats=gearCats();
  let shown=0;
  gcats.forEach(c=>{
    const all=S.gear.filter(g=>g.c===c);const its=all.filter(g=>gf==='all'||(gf==='in')===!!g.s);if(!its.length)return;shown+=its.length;
    w.append(h('h3',{},c+' · '+all.filter(g=>g.s).length+'/'+all.length));
    its.forEach(g=>{
      if(edit&&ren===g){w.append(renameRow(g,S.gear,render));return}
      w.append(h('div',{c:'item'},
        edit?h('button',{c:'nm','aria-label':'Rename '+g.n,onclick:()=>{ren=g;renMsg='';render()}},g.n,h('span',{c:'chev'},'✎'))
            :h('button',{c:'nm','aria-label':'Details for '+g.n,onclick:()=>{gdet=g;drawSheet()}},h('div',{c:'lbl'},h('span',{},g.n,g.u?h('span',{c:'tag'},'added'):null,h('span',{c:'chev'},'›')),g.w?h('span',{c:'why'},g.w):null)),
        edit?h('button',{c:'del','aria-label':'Delete '+g.n,onclick:()=>{removeGear(g);render()}},'✕')
            :h('button',{c:'tg'+(g.s?' on':''),role:'switch','aria-label':g.n,'aria-checked':String(!!g.s),onclick:()=>{g.s=g.s?0:1;save();render()}},h('i'))));
    });
  });
  if(!shown)w.append(h('div',{c:'empty'},gf==='out'?'Nothing missing. Your kit is complete.':'Nothing to show here.'));
  w.append(h('h3',{},'Add to the list'));
  const nm=h('input',{placeholder:'Item, e.g. Lewis bag',style:'flex:1 1 100%'});
  const wy=h('input',{placeholder:'What it is for (optional)',style:'flex:1 1 100%'});
  const sel=h('select',{style:'flex:1'},...gcats.map(c=>h('option',{value:c},c)),h('option',{value:'__new'},'New category…'));
  const nc=h('input',{placeholder:'New category name',style:'flex:1 1 100%;display:none'});
  sel.onchange=()=>{nc.style.display=sel.value==='__new'?'':'none';if(sel.value==='__new')nc.focus()};
  const add=()=>{const v=nm.value.trim();if(!v)return;const c=sel.value==='__new'?nc.value.trim():sel.value;if(!c){nc.focus();return}S.gear.push({n:v,c,w:wy.value.trim()||undefined,s:1,u:1});save();render()};
  nm.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  w.append(h('div',{c:'row2'},nm,wy,sel,nc,h('button',{c:'btn',onclick:add},'Add')));
  return w;
}
// ---------- Settings tab ----------
function settings(){
  const w=h('div');w.append(h('h1',{},'Settings'));
  // Appearance
  w.append(h('h3',{},'Appearance'));
  const ap=h('div',{c:'row2'});
  [['auto','Match phone'],['light','Light'],['dark','Dark']].forEach(([v,l])=>ap.append(h('button',{c:'chip'+(P.theme===v?' on':''),onclick:()=>{P.theme=v;store('homebar_prefs',P);applyTheme();render()}},l)));
  w.append(ap);
  // Gemini
  w.append(h('h3',{},'AI (Gemini)'));
  const ki=h('input',{type:'password',placeholder:'Gemini API key',autocomplete:'off',style:'flex:1 1 100%'});ki.value=gkey();
  const mi=h('input',{placeholder:'Model, e.g. '+GDEF,style:'flex:1 1 100%'});mi.value=gmodel();
  const kn=h('div',{c:'sum'});
  if(gkey())kn.textContent='Key saved on this device. It powers "How to make", "Surprise me", "Add from photo" and tasting notes.';
  else kn.append('No key yet. Create a free key at ',h('a',{href:'https://aistudio.google.com/apikey',target:'_blank',rel:'noopener'},'Google AI Studio'),', paste it above and tap Save.');
  const keep=()=>gset(ki.value.trim(),mi.value.trim());
  const tb=h('button',{c:'chip',onclick:()=>test()},'Test');
  const test=async()=>{keep();if(!gkey()){kn.textContent=gerr({code:'nokey'});return}if(tb.disabled)return;tb.disabled=true;kn.textContent='Testing…';
    try{const t=await gemini('Reply with the single word OK.',null,m=>{kn.textContent='Testing… trying '+gShort(m)});const w=gWhy();kn.textContent='Gemini replied: '+(t||'(empty)')+(w?'. '+w:' · key and model work.')}catch(e){kn.textContent=gerr(e)}finally{tb.disabled=false}};
  w.append(h('div',{c:'row2'},ki,mi),
    h('div',{c:'row2'},h('button',{c:'btn',onclick:()=>{keep();render()}},'Save'),tb,h('button',{c:'chip',onclick:()=>{gset('',gmodel());render()}},'Clear key')),kn,
    h('div',{c:'sum',style:'margin-top:8px'},'If this model is busy, out of quota or not found, the app tries the other free-tier models in turn: '+gorder().slice(1).join(', ')+'. An answer from a stand-in says so underneath.'));
  // Backup
  const note=h('div',{c:'sum'}),say=t=>{note.textContent=t};note.textContent=bkMsg;bkMsg='';
  const str=v=>typeof v==='string'&&v.trim()?v:undefined,obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
  // Accepts both the old item-only backup and the full v12 backup (items, gear, saved recipes, Gemini cache, preferences). Never the key.
  const restore=txt=>{try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.items)||!d.items.every(i=>i&&typeof i.n==='string'&&typeof i.c==='string'))throw 0;
    const gear=Array.isArray(d.gear)?d.gear.filter(g=>g&&typeof g.n==='string').map(g=>({n:g.n,c:typeof g.c==='string'?g.c:'Equipment',w:g.w?String(g.w):undefined,s:g.s?1:0,u:g.u?1:undefined,note:str(g.note)})):seedGear();
    const ingOf=v=>{if(!Array.isArray(v))return undefined;const g=v.map(a=>Array.isArray(a)?a.filter(o=>typeof o==='string'&&o.trim()).slice(0,3):[]).filter(a=>a.length).slice(0,12);return g.length?g:undefined};
    const saved=Array.isArray(d.saved)?d.saved.filter(x=>x&&typeof x.name==='string'&&typeof x.text==='string').map(x=>({id:String(x.id||uid()),name:x.name,text:x.text,src:x.src==='recipe'?'recipe':'ideas',extra:str(x.extra),ing:ingOf(x.ing),t:+x.t||Date.now()})):[];
    const url=v=>typeof v==='string'&&/^https?:\/\//i.test(v.trim())?v.trim():undefined;
    S={items:d.items.map(i=>({n:i.n,c:i.c,s:i.s?1:0,u:i.u?1:undefined,l:i.s&&i.l?1:undefined,af:i.af?1:undefined,note:str(i.note),url:url(i.url)})),gear,saved};migrateAF();migrateGear();save();   // older backups: move alcohol-free items to their drink's category, add new kit
    let more='';
    if(d.ai){const a=obj(d.ai);
      AI.rec=Object.fromEntries(Object.entries(obj(a.rec)).filter(([k,v])=>typeof v==='string'));
      const nmap=o=>Object.fromEntries(Object.entries(obj(o)).filter(([k,v])=>v&&typeof v.text==='string').map(([k,v])=>[k,{text:v.text,t:+v.t||Date.now()}]));
      AI.notes=nmap(a.notes);AI.gear=nmap(a.gear);
      const id=obj(a.ideas);AI.ideas=typeof id.text==='string'?{text:id.text,mood:str(id.mood)||'Anything',style:str(id.style)||'Any',extra:str(id.extra)||'',t:+id.t||Date.now()}:null;
      if(AI.ideas){mood=AI.ideas.mood;style=AI.ideas.style;extra=AI.ideas.extra}
      store('homebar_ai',AI);
      const n=Object.keys(AI.notes).length,r=Object.keys(AI.rec).length,k=Object.keys(AI.gear).length;more=', '+n+' tasting note'+(n===1?'':'s')+(k?', '+k+' kit tip'+(k===1?'':'s'):'')+' and '+r+' cached recipe'+(r===1?'':'s')}
    if(d.prefs){const p=obj(d.prefs);if(['auto','light','dark'].includes(p.theme))P.theme=p.theme;P.col=obj(p.col);applyTheme()}
    P.lastBk=Date.now();P.chg=0;P.bkLater=0;store('homebar_prefs',P);   // the file just restored is itself a backup of this state
    bkMsg='Restored '+S.items.length+' items, '+S.gear.length+' essentials, '+saved.length+' saved recipe'+(saved.length===1?'':'s')+more+'.';render()}catch(e){say('That does not look like a Home Bar backup.')}};
  const bkl=h('div',{c:'sum'});
  const bkLine=()=>{bkl.textContent=P.lastBk?'Last backup: '+new Date(P.lastBk).toLocaleDateString()+' ('+ago(P.lastBk)+')'+(S.t>P.lastBk?' · changed since':' · up to date'):'No backup taken yet.'};bkLine();
  const exp=()=>exportBackup(t=>{say(t);bkLine()});
  const fi=h('input',{type:'file',accept:'.json,application/json',onchange:async e=>{const f=e.target.files[0];if(!f)return;try{restore(await f.text())}catch(x){say('Could not read that file.')}}});
  const ta=h('textarea',{rows:'3',placeholder:'…or paste backup text here'});
  w.append(h('h3',{},'Backup'),h('div',{c:'sum'},'Everything is saved on this device only: your lists, tasting notes, saved recipes and settings. The API key is never included. For a copy that survives a new phone, export a backup: where the browser offers sharing this opens the share sheet so you can send it straight to OneDrive, otherwise it downloads the file. A reminder appears on the Bar tab when a backup is overdue.'),
    h('div',{c:'sum'},canShare()?null:'Sharing is not available at this address. On Android, opening the file from a file manager gives a content:// address with no share sheet; opening it in Chrome at a file:/// address (for example file:///sdcard/Download/Home%20Bar.html) brings the share sheet and clipboard back. Chrome keeps data per address, so export here first and restore there.'),
    bkl,h('div',{c:'row2'},h('button',{c:'btn',onclick:exp},'Export backup')),h('div',{c:'sum'},'Restore from a backup file:'),h('div',{c:'row2'},fi),ta,
    h('div',{c:'row2'},h('button',{c:'chip',onclick:()=>restore(ta.value)},'Restore from pasted text')),note);
  // Defaults
  const dn=h('div',{c:'sum'});
  w.append(h('h3',{},'Default items'),h('div',{c:'sum'},'"Restore missing defaults" adds back any default bottle or essential you deleted and keeps everything you added. "Reset everything" wipes both lists, saved recipes and all cached Gemini answers and starts again from the defaults. Your key and appearance stay.'),
    h('div',{c:'row2'},h('button',{c:'chip',onclick:()=>{const n=restoreDefaults();dn.textContent=n?n+' default item'+(n>1?'s':'')+' added back.':'All defaults are already present.'}},'Restore missing defaults'),
      h('button',{c:'chip warn',onclick:()=>{if(!confirmReset){confirmReset=true;render();return}resetAll();confirmReset=false;render()}},confirmReset?'Tap again to reset everything':'Reset everything')),dn);
  w.append(h('h3',{},'About'),h('div',{c:'sum'},'Home Bar '+VERSION+' · '+S.items.length+' items · '+S.gear.length+' essentials · '+S.saved.length+' saved recipe'+(S.saved.length===1?'':'s')+' · data stays on this device.'));
  return w;
}
// ---------- Render ----------
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#main').replaceChildren(tab==='stock'?stock():tab==='cocktails'?cocks():tab==='ideas'?ideas():tab==='gear'?gear():settings());
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.t;confirmReset=false;delS=null;ren=null;renMsg='';edit=false;scanMsg='';det=null;gdet=null;drawSheet();render();scrollTo(0,0)}));
applyTheme();render();
